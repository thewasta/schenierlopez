# This Nixpkgs commit provides Node 22.23.5, meeting pnpm 11.5.1's Node requirement.
[phases.setup]
nixpkgsArchive = 'cc368858ca7a000e1b3f014d94df9f0ea3b62391'

# Corepack 0.34.7 fixes pnpm 11's ESM binary mapping.
[phases.install]
cmds = [
  "npm install -g corepack@0.34.7 && corepack enable",
  "pnpm i --frozen-lockfile",
]
